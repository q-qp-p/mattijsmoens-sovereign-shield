[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-shield"
version = "3.4.3"
description = "Production-grade AI defense — hybrid deterministic filters + optional LLM veto + HITL approval + file validation + hallucination detection. OS-enforced immutability."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.8"
authors = [
    {name = "Mattijs Moens"}
]
keywords = [
    "ai-security",
    "prompt-injection",
    "firewall",
    "llm-security",
    "content-moderation",
    "input-validation",
    "tamper-detection",
    "ethical-ai",
    "jailbreak-prevention",
    "self-improving",
    "adaptive-learning",
    "multilingual-security",
    "os-memory-protection"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C",
    "Operating System :: OS Independent",
]
# No runtime dependencies. The entire engine - InputFilter, CoreSafety,
# Conscience, AdaptiveShield, VetoShield, canonical_json and the local daemon
# (stdlib http.server) - is pure standard library.
#
# fastapi/uvicorn/pydantic were previously declared here, which made the
# "zero core dependencies" badge false and pulled a web stack into every
# install. Nothing in the package imports them.
dependencies = []

[project.optional-dependencies]
gemini = ["google-genai>=1.0.0"]
openai = ["openai>=1.0.0"]
all = ["google-genai>=1.0.0", "openai>=1.0.0"]

[project.urls]
Homepage = "https://github.com/mattijsmoens/sovereign-shield"
Documentation = "https://github.com/mattijsmoens/sovereign-shield#readme"
Issues = "https://github.com/mattijsmoens/sovereign-shield/issues"

[project.scripts]
sovereign-shield-daemon = "sovereign_shield.daemon:start_server"

[tool.setuptools.packages.find]
include = ["sovereign_shield*"]

[tool.setuptools.package-data]
sovereign_shield = ["data/*.json", "*.c"]
